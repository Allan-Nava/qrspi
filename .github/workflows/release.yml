name: Release

# Cut a release by pushing the tag that `claude plugin tag` creates:
#
#   npm test && claude plugin tag . --push     # -> qrspi--v0.1.0
#
# Everything after that happens here, with no npm token anywhere: the publish
# authenticates through OIDC (npm Trusted Publishing), configured on the package
# at npmjs.com against this repository and this workflow filename.
#
# DO NOT RENAME THIS FILE. The trusted publisher on npm is bound to the literal
# name `release.yml`; rename it and the publish stops authenticating, with an
# error that does not mention the filename.

on:
  push:
    tags: ['qrspi--v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release, e.g. qrspi--v0.1.0'
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # create the GitHub release
      issues: write     # close the milestone
      id-token: write   # OIDC: this is what authenticates the publish
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # The tag is the source of truth for what is being released; package.json
      # must agree, and `npm test` checks the other two manifests against it.
      - name: Resolve and verify the version
        id: v
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          TAG_VERSION="${TAG#qrspi--v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag $TAG says $TAG_VERSION but package.json says $PKG_VERSION"
            exit 1
          fi
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"

      # Trusted publishing needs npm >= 11.5.1 and Node 22 still bundles npm 10.
      # Pinned on purpose: `npm@latest` would put a moving dependency in the
      # publishing path, where a release can break because npm shipped last
      # night. Bump this deliberately.
      - name: Use an npm that speaks OIDC
        run: |
          npm install -g npm@11.19.0
          npm --version

      # --ignore-scripts: this job holds the OIDC publishing privilege, so no
      # dependency lifecycle script runs beside it. The only dependency is
      # `marked`, used by the site build, and it needs no scripts.
      - run: npm install --no-audit --no-fund --ignore-scripts
      - run: npm test
      - run: npm run build:site

      # No token: OIDC. Provenance is generated automatically for a public
      # package published this way, so --provenance is not passed.
      #
      # Skipping an already-published version is what makes a bootstrap release
      # work: npm forbids configuring a trusted publisher for a package that does
      # not exist, so the very first version is published by hand, and this job
      # still has to be able to cut its release and close its milestone.
      - name: Publish to npm
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          if [ "$(npm view "qrspi@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
            echo "::notice::qrspi@$VERSION is already on the registry — skipping publish"
            exit 0
          fi
          # Belt and braces: nothing should be able to authenticate this publish
          # except OIDC, not even a token someone reintroduces into the env.
          unset NODE_AUTH_TOKEN
          npm publish --access public

      # The registry takes a moment to serve a freshly published version.
      - name: Verify the published version
        run: |
          for i in 1 2 3 4 5 6; do
            if [ "$(npm view "qrspi@${{ steps.v.outputs.version }}" version 2>/dev/null)" = "${{ steps.v.outputs.version }}" ]; then
              echo "qrspi@${{ steps.v.outputs.version }} is live"; exit 0
            fi
            echo "not visible yet, retrying…"; sleep 10
          done
          echo "::error::qrspi@${{ steps.v.outputs.version }} did not appear on the registry"
          exit 1

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.v.outputs.tag }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          gh release create "$TAG" --title "v$VERSION" --generate-notes --verify-tag
          {
            echo "## Install"
            echo
            echo '```'
            echo "/plugin marketplace add Allan-Nava/qrspi"
            echo "/plugin install qrspi"
            echo '```'
            echo
            echo "Or from a shell:"
            echo
            echo '```'
            echo "npx qrspi@$VERSION install"
            echo '```'
            echo
            echo "Docs: https://allan-nava.github.io/qrspi/"
            echo
            echo "---"
            echo
            gh release view "$TAG" --json body --jq .body
          } > /tmp/notes.md
          gh release edit "$TAG" --notes-file /tmp/notes.md

      # Only when it is actually finished — a milestone with open issues stays
      # open, and says so in the log.
      - name: Close the milestone
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          NUM=$(gh api "repos/$GITHUB_REPOSITORY/milestones?state=open" \
                  --jq ".[] | select(.title | startswith(\"v$VERSION\")) | .number" | head -1)
          if [ -z "$NUM" ]; then
            echo "::notice::no open milestone titled v$VERSION — nothing to close"
            exit 0
          fi
          OPEN=$(gh api "repos/$GITHUB_REPOSITORY/milestones/$NUM" --jq .open_issues)
          if [ "$OPEN" != "0" ]; then
            echo "::warning::milestone #$NUM still has $OPEN open issue(s) — leaving it open"
            exit 0
          fi
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/milestones/$NUM" -f state=closed \
            --jq '"closed milestone: \(.title)"'
