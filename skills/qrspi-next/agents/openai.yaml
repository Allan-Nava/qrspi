interface:
  display_name: "QRSPI: next phase"
  short_description: "Detect the phase, gate on quality, emit the next prompt"
policy:
  # Explicit `$qrspi-next` only. A phase command is user-driven and sequential; it
  # must never be picked up because a prompt resembled it (README, "Two design notes").
  allow_implicit_invocation: false
