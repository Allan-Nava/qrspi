interface:
  display_name: "QRSPI: review artifact"
  short_description: "Judgement-level review of one artifact; reports, edits nothing"
policy:
  # Explicit `$qrspi-review` only. A phase command is user-driven and sequential; it
  # must never be picked up because a prompt resembled it (README, "Two design notes").
  allow_implicit_invocation: false
